name: Checksum checks

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'containers/mlm-supportconfig/kubectl-mlm_supportconfig*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the checksums
        run: |
          cd containers/mlm-supportconfig
          sha512sum -c kubectl-mlm_supportconfig.sha512
