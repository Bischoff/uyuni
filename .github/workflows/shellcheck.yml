name: ShellCheck

on:
  pull_request:
    paths:
      - '.github/workflows/shellcheck.yml'
      - 'testsuite/features/upload_files/**/*.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    - name: Run ShellCheck
      run: find testsuite/features/upload_files -name '*.sh' -print0 | xargs -0 shellcheck -S warning
