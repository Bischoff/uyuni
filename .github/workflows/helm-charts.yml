name: Helm Chart CI

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'containers/proxy-helm/**'
      - 'containers/server-helm/**'

permissions:
  contents: read

jobs:
  helm-charts-tests:
    runs-on: ubuntu-latest
    container: registry.opensuse.org/systemsmanagement/uyuni/master/docker/containers/uyuni-helm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Proxy helm chart tests
        run: |
          pushd containers/proxy-helm
          ./test.sh
          popd
      
      - name: Server helm chart tests
        run: |
          pushd containers/server-helm
          ./test.sh
          popd
